---
# Single playbook for this machine. Target is auto-detected from facts
# (Debian / Darwin) unless linux.yml, mac.yml, or ./ansible/install set it.
- name: Home
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    user: "{{ ansible_facts.user_id }}"
    home_dir: "{{ ansible_facts.user_dir }}"
    repo_root: "{{ playbook_dir | dirname }}"
    dotfiles_dir: "{{ repo_root }}/dotfiles"
    src_root: "{{ repo_root | dirname }}"
    neovim_src: "{{ src_root }}/neovim"
    neovim_repo: https://github.com/neovim/neovim.git
    neovim_git_ref: stable
    neovim_build_type: RelWithDebInfo
    neovim_prefix: "{{ home_dir }}/.local"
    homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts.architecture in ['arm64', 'aarch64'] else '/usr/local' }}"
    neovim_build_env:
      PATH: "{{ lookup('env', 'HOME') }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ lookup('env', 'PATH') }}"
    git_user_name: brian-stanton
    git_user_email: stanton.brian.c@gmail.com
    # Opt out of MATE/i3 session commands (dconf). Docker sets this.
    # Desktop packages and i3 configs still install on Linux.
    home_headless: "{{ lookup('env', 'HOME_HEADLESS') | default('0', true) | bool }}"

  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:{{ lookup('env', 'PATH') }}"

  pre_tasks:
    - name: Only Debian and Darwin are supported
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ['Debian', 'Darwin']
        fail_msg: >-
          Unsupported OS: {{ ansible_facts.os_family }} ({{ ansible_facts.distribution }}).
          Supported targets: linux (Debian/Ubuntu) and mac (Darwin).
      tags: [always]

    - name: Confirm requested target matches this machine
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == home_target
        fail_msg: >-
          Target {{ home_target }} does not match this host
          ({{ ansible_facts.os_family }} / {{ ansible_facts.distribution }}).
          Run ./ansible/install from the machine you want to provision,
          or pass the matching target (mac or linux).
      when: (home_target | default('auto')) != 'auto'
      tags: [always]

    - name: Load {{ ansible_facts.os_family }} variables
      ansible.builtin.include_vars: "vars/{{ ansible_facts.os_family }}.yml"
      tags: [always]

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
      when: ansible_facts.os_family == 'Debian'
      tags: [always]

    - name: Locate Homebrew
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [homebrew_prefix ~ '/bin/brew', '/opt/homebrew/bin/brew', '/usr/local/bin/brew'] | unique }}"
      register: homebrew_bins
      when: ansible_facts.os_family == 'Darwin'
      tags: [always]

    - name: Install Homebrew
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        executable: /bin/bash
      when:
        - ansible_facts.os_family == 'Darwin'
        - homebrew_bins is not skipped
        - homebrew_bins.results | selectattr('stat.exists') | list | length == 0
      tags: [always]

    - name: Ensure ~/.config exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.config"
        state: directory
        mode: "0755"
      tags: [always]

  tasks:
    - ansible.builtin.import_tasks: tasks/core.yml
      tags: [core]

    - ansible.builtin.import_tasks: tasks/git.yml
      tags: [git]

    - ansible.builtin.import_tasks: tasks/zsh.yml
      tags: [zsh]

    - ansible.builtin.import_tasks: tasks/neovim.yml
      tags: [neovim]

    - ansible.builtin.import_tasks: tasks/alacritty.yml
      tags: [alacritty]

    - ansible.builtin.import_tasks: tasks/productivity.yml
      tags: [productivity]

    - ansible.builtin.import_tasks: tasks/tmux.yml
      tags: [tmux]

    - ansible.builtin.import_tasks: tasks/obsidian.yml
      tags: [obsidian]

    - ansible.builtin.import_tasks: tasks/fonts.yml
      tags: [fonts]

    - ansible.builtin.import_tasks: tasks/desktop.yml
      tags: [desktop, i3]

    - ansible.builtin.import_tasks: tasks/ssh.yml
      tags: [ssh]

    # Static import with no tags of its own: per-task tags in the file
    # decide what runs (so `neovim` still links the nvim config).
    - ansible.builtin.import_tasks: tasks/dotfiles.yml
