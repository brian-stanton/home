---
- name: Install zsh
  ansible.builtin.include_tasks:
    file: tasks/_packages.yml
    apply:
      tags: [always]
  vars:
    packages: "{{ zsh_packages }}"
    package_label: zsh

- name: Set login shell to zsh
  ansible.builtin.user:
    name: "{{ user }}"
    shell: /usr/bin/zsh
  become: true
  when: ansible_facts.os_family == 'Debian'
