---
- name: Link zshrc
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.zshrc"
      dest: "{{ home_dir }}/.zshrc"
  tags: [zsh, core, dotfiles]

- name: Link zsh_profile
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.zsh_profile"
      dest: "{{ home_dir }}/.zsh_profile"
  tags: [zsh, core, dotfiles]

- name: Link zprofile
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.zprofile"
      dest: "{{ home_dir }}/.zprofile"
  tags: [zsh, core, dotfiles]

# Per-host shell config, one file per machine, sourced from .zsh_profile.
# Only the hosts/ subdirectory is linked: ~/.config/home itself stays a real
# directory so runtime files written there (display.env) never land in the repo.
- name: Ensure ~/.config/home exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/home"
    state: directory
    mode: "0755"
  tags: [zsh, core, dotfiles]

- name: Link per-host shell configs
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.config/home/hosts"
      dest: "{{ home_dir }}/.config/home/hosts"
  tags: [zsh, core, dotfiles]

- name: Link alacritty config
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.config/alacritty"
      dest: "{{ home_dir }}/.config/alacritty"
  tags: [alacritty, desktop, dotfiles]

- name: Link neovim config
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.config/nvim"
      dest: "{{ home_dir }}/.config/nvim"
  tags: [neovim, core, dotfiles]

- name: Link tmux config
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.tmux.conf"
      dest: "{{ home_dir }}/.tmux.conf"
  tags: [tmux, core, dotfiles]

- name: Link xprofile
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.xprofile"
      dest: "{{ home_dir }}/.xprofile"
  when: ansible_facts.os_family == 'Debian'
  tags: [desktop, i3, dotfiles]

- name: Link i3 config
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.config/i3"
      dest: "{{ home_dir }}/.config/i3"
  when: ansible_facts.os_family == 'Debian'
  tags: [desktop, i3, dotfiles]

- name: Link i3status config
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ dotfiles_dir }}/.config/i3status"
      dest: "{{ home_dir }}/.config/i3status"
  when: ansible_facts.os_family == 'Debian'
  tags: [desktop, i3, dotfiles]

# iTerm2 reads every file in DynamicProfiles and reloads them while it runs.
# iTerm2 owns that directory and recreates it, so link the profiles into it
# rather than replacing the directory itself.
- name: Ensure iTerm2 DynamicProfiles directory exists
  ansible.builtin.file:
    path: "{{ iterm2_dynamic_profiles_dir }}"
    state: directory
    mode: "0755"
  when: ansible_facts.os_family == 'Darwin'
  tags: [iterm2, desktop, dotfiles]

- name: Link iTerm2 dynamic profiles
  ansible.builtin.include_tasks:
    file: tasks/_link.yml
    apply:
      tags: [always]
  vars:
    link:
      src: "{{ item }}"
      dest: "{{ iterm2_dynamic_profiles_dir }}/{{ item | basename }}"
  loop: "{{ query('ansible.builtin.fileglob', dotfiles_dir ~ '/.config/iterm2/DynamicProfiles/*.json') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  when: ansible_facts.os_family == 'Darwin'
  tags: [iterm2, desktop, dotfiles]
