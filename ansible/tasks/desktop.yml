---
- name: Install Linux desktop packages
  ansible.builtin.include_tasks:
    file: tasks/_packages.yml
    apply:
      tags: [always]
  vars:
    packages: "{{ desktop_packages }}"
    package_label: Linux desktop packages
  when: ansible_facts.os_family == 'Debian'

- name: Use i3 as the MATE window manager
  ansible.builtin.command: dconf write /org/mate/desktop/session/required-components/windowmanager "'i3'"
  changed_when: false
  when:
    - ansible_facts.os_family == 'Debian'
    - not home_headless

- name: Hide MATE desktop icons
  ansible.builtin.command: dconf write /org/mate/desktop/background/show-desktop-icons "false"
  changed_when: false
  when:
    - ansible_facts.os_family == 'Debian'
    - not home_headless

- name: Set keyboard repeat rate
  ansible.builtin.command: xset r rate 292 76
  changed_when: false
  environment:
    DISPLAY: "{{ ansible_facts.env.DISPLAY | default(':0') }}"
    XAUTHORITY: "{{ home_dir }}/.Xauthority"
  when:
    - ansible_facts.os_family == 'Debian'
    - not home_headless
